name: DevelopBuild
on:
  push:
    branches:
      - master
env:
  # リポジトリのルートディレクトリを起点としたソリューションファイルのパス
  SOLUTION_FILE_PATH: Hagine.sln
  # Visual Studio の構成(Debug / Develop / Release)
  # Develop = 最適化あり + エディタ(USE_IMGUI)あり
  CONFIGURATION: Develop
jobs:
  build:
    runs-on: windows-2022

    steps:
       - name: Checkout
         uses: actions/checkout@v4
       - name: Add MSBuild to PATH
         uses: microsoft/setup-msbuild@v2
         with:
           msbuild-architecture: x64
       - name: Build
         run: |
           msbuild ${{env.SOLUTION_FILE_PATH}} /p:Platform=x64,Configuration=${{env.CONFIGURATION}}
